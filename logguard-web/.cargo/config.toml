# Static Linux builds from macOS without a C cross toolchain:
#   cargo build --release --target x86_64-unknown-linux-musl          (amd64)
#   cargo build --release --target aarch64-unknown-linux-musl         (arm64)
#   cargo build --release --target armv7-unknown-linux-musleabihf     (32-bit ARM, ARMv7 hard-float)
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

# ring (the TLS crypto) has some C and assembly. Apple clang compiles them as freestanding
# objects for the target; RING_CORE_NOSTDLIBINC makes ring skip the libc headers it would
# otherwise want (there are no musl headers on this Mac). llvm-ar (rustup component
# llvm-tools) packs them in an archive the ELF linker can read.
[env]
AR_x86_64_unknown_linux_musl = { value = "scripts/llvm-ar", relative = true }
CC_x86_64_unknown_linux_musl = "clang"
CFLAGS_x86_64_unknown_linux_musl = "--target=x86_64-unknown-linux-gnu -ffreestanding -DRING_CORE_NOSTDLIBINC=1"
AR_aarch64_unknown_linux_musl = { value = "scripts/llvm-ar", relative = true }
CC_aarch64_unknown_linux_musl = "clang"
CFLAGS_aarch64_unknown_linux_musl = "--target=aarch64-unknown-linux-gnu -ffreestanding -DRING_CORE_NOSTDLIBINC=1"
AR_armv7_unknown_linux_musleabihf = { value = "scripts/llvm-ar", relative = true }
CC_armv7_unknown_linux_musleabihf = "clang"
CFLAGS_armv7_unknown_linux_musleabihf = "--target=armv7-unknown-linux-gnueabihf -mfloat-abi=hard -mfpu=vfpv3-d16 -ffreestanding -DRING_CORE_NOSTDLIBINC=1"
