[package]
name = "logguard-mail-bot"
version = "0.4.0"
edition = "2021"
description = "Send-only mail bot delivering logguard's admin alerts, digests and reports, OpenPGP-encrypted"
license = "MIT"
repository = "https://github.com/makhort/Logguard"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
# the pseudonyms of SANITIZE=on (src/redact.rs, as logguard-tg-bot)
hmac = "0.12"
# SMTP: blocking client (the bot only sends), rustls with ring (as the other bots): no
# OpenSSL, no aws-lc, so the static musl build works. The system's CA store (/etc/ssl/certs).
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls", "ring", "rustls-native-certs"] }
log = { version = "0.4", features = ["std"] }
# OpenPGP (seal.rs): pure Rust, MIT/Apache; it takes rand 0.8's RNG traits
pgp = { version = "0.21", default-features = false }
quoted_printable = "0.5"
rand = "0.9"
rand08 = { package = "rand", version = "0.8" }
# lettre's own source of the system's CAs; the bot checks there are some
rustls-native-certs = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
signal-hook = { version = "0.3", default-features = false }

[dev-dependencies]
# the fake mail server in tests/fake_smtp.rs: a test CA and a TLS server
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The distribution packages (scripts/package.sh builds them with cargo-deb and
# cargo-generate-rpm; README, "Install from a package"). The deploy files come from
# target/package/stage/, where package.sh puts deploy/'s files; the maintainer scripts are
# deploy/pkg/. Both tables list the same files.
[package.metadata.deb]
maintainer = "makhort <makhort@users.noreply.github.com>"
copyright = "2026 The logguard contributors"
license-file = ["target/package/stage/LICENSE", "0"]
section = "admin"
priority = "optional"
depends = "systemd, ca-certificates"
extended-description = """\
logguard-mail-bot mails logguard's admin alerts, digests and abuse reports, each \
OpenPGP-encrypted as a whole (subject included) to the recipients' keys, through your SMTP \
server. It installs to /opt/logguard-mail-bot as its own system user, with config.env from the \
template; nothing is started until it is filled in."""
maintainer-scripts = "deploy/pkg"
assets = [
    ["target/release/logguard-mail-bot", "opt/logguard-mail-bot/", "755"],
    ["target/package/stage/config.env.example", "opt/logguard-mail-bot/", "644"],
    ["target/package/stage/logguard-mail-bot.service", "usr/lib/systemd/system/", "644"],
    ["target/package/stage/logguard-mail-bot.logrotate", "etc/logrotate.d/logguard-mail-bot", "644"],
    ["README.md", "usr/share/doc/logguard-mail-bot/", "644"],
]

[package.metadata.generate-rpm]
summary = "Send-only mail bot delivering logguard's admin messages, OpenPGP-encrypted"
url = "https://github.com/makhort/Logguard"
release = "1"
auto-req = "no"
post_install_script = "deploy/pkg/postinst"
post_install_script_prog = ["/bin/bash"]
pre_uninstall_script = "deploy/pkg/prerm"
pre_uninstall_script_prog = ["/bin/bash"]
post_uninstall_script = "deploy/pkg/postrm"
post_uninstall_script_prog = ["/bin/bash"]
assets = [
    { source = "target/release/logguard-mail-bot", dest = "/opt/logguard-mail-bot/logguard-mail-bot", mode = "755" },
    { source = "target/package/stage/config.env.example", dest = "/opt/logguard-mail-bot/config.env.example", mode = "644" },
    { source = "target/package/stage/logguard-mail-bot.service", dest = "/usr/lib/systemd/system/logguard-mail-bot.service", mode = "644" },
    { source = "target/package/stage/logguard-mail-bot.logrotate", dest = "/etc/logrotate.d/logguard-mail-bot", mode = "644", config = "noreplace" },
    { source = "README.md", dest = "/usr/share/doc/logguard-mail-bot/README.md", mode = "644", doc = true },
    { source = "target/package/stage/LICENSE", dest = "/usr/share/doc/logguard-mail-bot/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
systemd = "*"
shadow-utils = "*"
ca-certificates = "*"
