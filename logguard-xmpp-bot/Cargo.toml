[package]
name = "logguard-xmpp-bot"
version = "0.1.0"
edition = "2021"
description = "XMPP chat bot exposing curated ejabberdctl commands"
license = "MIT"

[dependencies]
aes = { version = "0.8", features = ["zeroize"] }
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
cbc = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = { version = "0.10", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
curve25519-dalek = "4"
ed25519-dalek = "2"
futures = "0.3"
hkdf = "0.12"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
log = { version = "0.4", features = ["std"] }
prost = "0.14"
rand = "0.9"
rustls-native-certs = "0.8"
sasl = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
shlex = "1"
tokio = { version = "1", features = ["rt", "macros", "process", "time", "signal", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-xmpp = { version = "6", default-features = false, features = ["starttls", "direct-tls", "ring", "rustls-native-certs"] }
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
