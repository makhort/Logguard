[package]
name = "logguard-signal-bot"
version = "0.2.0"
edition = "2021"
description = "Signal bot delivering logguard's admin alerts, digests and reports through signal-cli, else as OpenPGP files"
license = "MIT"
repository = "https://github.com/makhort/Logguard"

[dependencies]
anyhow = "1"
# attachments go to signal-cli as data: URIs
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
# the pseudonyms of SANITIZE=on (src/redact.rs, as logguard-tg-bot)
hmac = "0.12"
# geteuid: `signal-cli` refuses to run as root (signal-cli's data must stay the bot's)
libc = "0.2"
log = { version = "0.4", features = ["std"] }
# OpenPGP for the fallback (seal.rs): pure Rust, MIT/Apache; it takes rand 0.8's RNG traits
pgp = { version = "0.21", default-features = false }
rand = "0.9"
rand08 = { package = "rand", version = "0.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "time", "signal", "sync", "process", "io-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The distribution packages (scripts/package.sh builds them with cargo-deb and
# cargo-generate-rpm; README, "Install from a package"). The deploy files come from
# target/package/stage/, where package.sh puts deploy/'s files; the maintainer scripts are
# deploy/pkg/. Both tables list the same files.
[package.metadata.deb]
maintainer = "makhort <makhort@users.noreply.github.com>"
copyright = "2026 The logguard contributors"
license-file = ["target/package/stage/LICENSE", "0"]
section = "admin"
priority = "optional"
depends = "systemd"
extended-description = """\
logguard-signal-bot sends logguard's admin alerts, digests and abuse reports over Signal \
through signal-cli (installed separately), as long as the safety number with the admin is the \
pinned one; else as OpenPGP-encrypted files. It installs to /opt/logguard-signal-bot as its own system user, with config.env from the \
template; nothing is started until it is filled in."""
maintainer-scripts = "deploy/pkg"
assets = [
    ["target/release/logguard-signal-bot", "opt/logguard-signal-bot/", "755"],
    ["target/package/stage/config.env.example", "opt/logguard-signal-bot/", "644"],
    ["target/package/stage/logguard-signal-bot.service", "usr/lib/systemd/system/", "644"],
    ["target/package/stage/logguard-signal-bot.logrotate", "etc/logrotate.d/logguard-signal-bot", "644"],
    ["README.md", "usr/share/doc/logguard-signal-bot/", "644"],
]

[package.metadata.generate-rpm]
summary = "Signal bot delivering logguard's admin messages through signal-cli"
url = "https://github.com/makhort/Logguard"
release = "1"
auto-req = "no"
post_install_script = "deploy/pkg/postinst"
post_install_script_prog = ["/bin/bash"]
pre_uninstall_script = "deploy/pkg/prerm"
pre_uninstall_script_prog = ["/bin/bash"]
post_uninstall_script = "deploy/pkg/postrm"
post_uninstall_script_prog = ["/bin/bash"]
assets = [
    { source = "target/release/logguard-signal-bot", dest = "/opt/logguard-signal-bot/logguard-signal-bot", mode = "755" },
    { source = "target/package/stage/config.env.example", dest = "/opt/logguard-signal-bot/config.env.example", mode = "644" },
    { source = "target/package/stage/logguard-signal-bot.service", dest = "/usr/lib/systemd/system/logguard-signal-bot.service", mode = "644" },
    { source = "target/package/stage/logguard-signal-bot.logrotate", dest = "/etc/logrotate.d/logguard-signal-bot", mode = "644", config = "noreplace" },
    { source = "README.md", dest = "/usr/share/doc/logguard-signal-bot/README.md", mode = "644", doc = true },
    { source = "target/package/stage/LICENSE", dest = "/usr/share/doc/logguard-signal-bot/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
systemd = "*"
shadow-utils = "*"
