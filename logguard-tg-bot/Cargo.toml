[package]
name = "logguard-tg-bot"
version = "0.4.0"
edition = "2021"
description = "Telegram bot delivering logguard's admin alerts, digests and reports"
license = "MIT"
repository = "https://github.com/makhort/Logguard"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
hmac = "0.12"
log = { version = "0.4", features = ["std"] }
# OpenPGP for the files (seal.rs): pure Rust, MIT/Apache; it takes rand 0.8's RNG traits
pgp = { version = "0.21", default-features = false }
rand = "0.9"
rand08 = { package = "rand", version = "0.8" }
# rustls with ring (as logguard-xmpp-bot): no OpenSSL, no aws-lc, so the static musl build works
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "time", "signal", "sync", "net", "io-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The distribution packages (scripts/package.sh builds them with cargo-deb and
# cargo-generate-rpm; README, "Install from a package"). The deploy files come from
# target/package/stage/, where package.sh puts deploy/'s files; the maintainer scripts are
# deploy/pkg/. Both tables list the same files.
[package.metadata.deb]
maintainer = "makhort <makhort@users.noreply.github.com>"
copyright = "2026 The logguard contributors"
license-file = ["target/package/stage/LICENSE", "0"]
section = "admin"
priority = "optional"
depends = "systemd, ca-certificates"
extended-description = """\
logguard-tg-bot sends logguard's admin alerts, digests and abuse reports to the admin's \
Telegram chat: account names become pseudonyms, servers appear by node id, and files go out \
OpenPGP-encrypted to the admin's key. It installs to /opt/logguard-tg-bot as its own system user, with config.env from the \
template; nothing is started until it is filled in."""
maintainer-scripts = "deploy/pkg"
assets = [
    ["target/release/logguard-tg-bot", "opt/logguard-tg-bot/", "755"],
    ["target/package/stage/config.env.example", "opt/logguard-tg-bot/", "644"],
    ["target/package/stage/logguard-tg-bot.service", "usr/lib/systemd/system/", "644"],
    ["target/package/stage/logguard-tg-bot.logrotate", "etc/logrotate.d/logguard-tg-bot", "644"],
    ["README.md", "usr/share/doc/logguard-tg-bot/", "644"],
]

[package.metadata.generate-rpm]
summary = "Telegram bot delivering logguard's admin alerts, digests and reports"
url = "https://github.com/makhort/Logguard"
release = "1"
auto-req = "no"
post_install_script = "deploy/pkg/postinst"
post_install_script_prog = ["/bin/bash"]
pre_uninstall_script = "deploy/pkg/prerm"
pre_uninstall_script_prog = ["/bin/bash"]
post_uninstall_script = "deploy/pkg/postrm"
post_uninstall_script_prog = ["/bin/bash"]
assets = [
    { source = "target/release/logguard-tg-bot", dest = "/opt/logguard-tg-bot/logguard-tg-bot", mode = "755" },
    { source = "target/package/stage/config.env.example", dest = "/opt/logguard-tg-bot/config.env.example", mode = "644" },
    { source = "target/package/stage/logguard-tg-bot.service", dest = "/usr/lib/systemd/system/logguard-tg-bot.service", mode = "644" },
    { source = "target/package/stage/logguard-tg-bot.logrotate", dest = "/etc/logrotate.d/logguard-tg-bot", mode = "644", config = "noreplace" },
    { source = "README.md", dest = "/usr/share/doc/logguard-tg-bot/README.md", mode = "644", doc = true },
    { source = "target/package/stage/LICENSE", dest = "/usr/share/doc/logguard-tg-bot/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
systemd = "*"
shadow-utils = "*"
ca-certificates = "*"
