[package]
name = "logguard"
version = "0.2.0"
edition = "2021"
description = "Near-realtime behaviour-based protection for SSH, ejabberd and UFW logs"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std", "getrandom"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
md-5 = { version = "0.10", default-features = false }
# line_count: the exact height of wrapped text, for the details pane and popups
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
# [[patterns]]: linear-time matching, whatever a log line holds; the lazy DFA keeps it fast
# without the size of the other engines (about 1 MB less)
regex = { version = "1", default-features = false, features = ["std", "perf-dfa", "unicode-perl", "unicode-case"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
signal-hook = "0.3"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The sample replays in tests/ scan a month of logs; keep them fast.
[profile.test]
opt-level = 2
