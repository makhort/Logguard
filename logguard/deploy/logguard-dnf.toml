# The variant of logguard.toml for Fedora and RHEL (dnf), written from it by
# scripts/dnf-templates.sh: edit that file, then run the script.
# logguard configuration. Anything omitted uses the built-in default;
# `logguard -c /etc/logguard/logguard.toml print-config` shows the full effective config.

# "shadow": detect and log decisions only. Switch to "enforce" after reviewing a
# week or two of decisions in `logguard tui` / /var/log/logguard/actions.jsonl.
mode = "shadow"
# "apt": dpkg and apt (Debian, Ubuntu); "dnf": rpm and dnf (Fedora, RHEL; the -dnf templates)
package_manager = "dnf"
state_file = "/var/lib/logguard/state.json"
socket = "/run/logguard/logguard.sock"
actions_log = "/var/log/logguard/actions.jsonl"

[sources]                 # which logs to analyse on this host
ejabberd = true
ssh = true
ufw = true
nextcloud_aio = true      # Nextcloud AIO, see [nextcloud_aio] (a Nextcloud without AIO: apps = ["nextcloud"]); was "nextcloud"
oom = true                # alert when the kernel kills a process for lack of memory ("system" topic)
privilege = true          # su and sudo: failures (someone has an account and tries for root) as alerts
pam = true                # PAM and account tools: console/polkit login failures, lockouts, passwords, new accounts and admins
audit = true              # the audit log: the same as the kernel records them, auditd stopped or switched off
audit_keys = []           # audit rule keys (auditctl -k) to alert on when their rules fire, e.g. ["identity"]; "*" for any
# audit_log = "/var/log/audit/audit.log"   # auditd's file instead of the journal (journald with Audit=no)
# Alert when one of these fails (any unsuccessful end: non-zero exit, signal, timeout, ...) and
# is not started again within service_restart_grace (by Restart= or by hand), or when systemd
# gives up restarting it. Failures systemd recovers from on its own say nothing.
services = ["logguard-xmpp-bot.service"]
service_restart_grace = "2m"      # longer than the units' RestartSec
# Built-in sources for common services (README, "Built-in sources for common services"):
# apache, nginx, haproxy, prosody, nextcloud (without AIO), owncloud (10), mysql (MariaDB too),
# postgresql, mongodb, redis (Valkey too), postfix, dovecot, logguard-web (the web console). Their logs are looked for in the usual places; [sources.app_logs] names others.
apps = []

[nextcloud_aio]           # was [nextcloud]
docker = "/usr/bin/docker"
# Apache's error log (secret-file probes, path traversal), read via `docker logs -f`
apache_container = "nextcloud-aio-apache"
# failed logins (JSON lines). `occ log:file` shows the path inside the container
# (/var/www/html/data/nextcloud.log); AIO mounts /var/www/html from the nextcloud_aio_nextcloud volume.
log_file = "/var/lib/docker/volumes/nextcloud_aio_nextcloud/_data/data/nextcloud.log"

[ports]
# Local ports that are never scored and, in enforce mode, never blocked (even for banned addresses).
whitelist = []
# One UFW-blocked connection attempt to any of these = immediate ban. Only blocked traffic is
# logged, so ports you serve can't trip. Keep it TCP: UDP senders are trivially spoofed.
tripwire = [
    "21/tcp", "23/tcp", "2323/tcp",                      # FTP, Telnet
    "25/tcp", "465/tcp", "587/tcp",                      # SMTP, SMTPS, submission (no MX points here)
    "110/tcp", "995/tcp", "143/tcp", "993/tcp",          # POP3(S), IMAP(S)
    "135/tcp", "139/tcp", "445/tcp", "3389/tcp", "5985/tcp", "5986/tcp", # Windows RPC, NetBIOS, SMB, RDP, WinRM
    "5900/tcp", "5901/tcp", "1723/tcp", "7547/tcp", "8291/tcp", # VNC, PPTP, TR-069, MikroTik Winbox
    "389/tcp", "2375/tcp", "2376/tcp",                   # LDAP, Docker API
    "1433/tcp", "1521/tcp", "3306/tcp", "5432/tcp", "27017/tcp", # MS SQL, Oracle, MySQL, PostgreSQL, MongoDB
    "6379/tcp", "9200/tcp", "11211/tcp",                 # Redis, Elasticsearch, Memcached
]
# Names in the dashboard's port histogram (XMPP client ports and the cluster port are named
# from [xmpp] and [cluster]).
names = { 5269 = "XMPP server", 5280 = "ejabberd HTTP", 5281 = "XMPP Invites", 5443 = "ejabberd HTTP", "5478/udp" = "ejabberd STUN" }
# Tripwire hits from logguard's own nftables table (enforce mode, nftables): the first new TCP
# connection per source every 10 minutes to a tripwire port nothing listens on is logged, at up
# to this rate for the whole host. UFW's log keeps only about 3 lines a minute for everything.
kernel_tripwires = true
kernel_tripwire_rate = "60/minute"
# Ports logguard listens on itself and closes at once: a completed TCP handshake can't come
# from a forged address, so a hit bans for certain (tripwire_connect). With any set, a blocked
# SYN to a tripwire port scores 50 instead of 100 unless [scoring.weights] says otherwise.
# Open them in the firewall (ufw allow 2323/tcp) and take them out of `tripwire`.
honeypot = []
# honeypot = ["2323/tcp", "5900/tcp"]

[canary]
# Account-level tripwires: names attackers guess but nobody here uses. One login attempt
# (or XMPP registration) on any of them = immediate ban; a *successful* login = critical alert.
# Never list a real account. No need to create these accounts: ejabberd logs a failed login
# for a non-existent account exactly like for a wrong password.
xmpp = ["test", "info", "support", "contact", "root", "administrator", "webmaster", "postmaster",
        "hostmaster", "user", "guest", "demo", "xmpp", "jabber", "office", "sales", "billing"]
# sshd admits only the gateway user (key-only): every other name is a probe.
ssh = ["*"]
nextcloud = []            # Nextcloud AIO, apps "nextcloud" and "owncloud". NOT "admin": AIO's initial admin account is called admin
except = ["admin", "0123456789abcdef0123456789abcdef"]   # real accounts: never canaries

[silence]
# Warn when a log source goes quiet ("no attacks" vs "not seeing logs"). Measured on a month of
# this server's logs: UFW and ejabberd were never silent for 3h outside an outage, sshd often was
# for a day. "0s" disables a source.
enabled = true
ufw = "2h"
ejabberd = "6h"
ssh = "2d"
nextcloud_aio = "0s"      # its logs only contain failures, so silence is normal (was "nextcloud")
# Logs of [sources] apps to warn about when quiet, none by default, e.g. after the keys above:
# [silence.apps]
# nginx_access = "2h"
# nextcloud = "7d"
# Lines arrive but none can be tied to a client address (e.g. ejabberd hide_sensitive_log_data).
blind_after = "6h"
blind_lines = 200

# Kernel rate limits on new connections per source address (enforce mode, nftables only).
# Active from the first packet, before scores react; also covers Docker-published ports,
# which UFW's `limit` rules never see. Allowlisted addresses are exempt.
# `logguard status` shows how many packets each rule dropped.
[[ratelimit]]
ports = ["5222/tcp", "5223/tcp"]     # XMPP clients: a phone reconnects a few times a minute at most
rate = "30/minute"
burst = 30
[[ratelimit]]
ports = ["3478/udp", "5349/tcp"]     # STUN/TURN(S): a call opens a handful of allocations
rate = "60/minute"
burst = 60
# Nextcloud: browsers and sync clients open many parallel connections - keep it generous.
# [[ratelimit]]
# ports = ["443/tcp"]
# rate = "300/minute"
# burst = 300

[allowlist]
# Never banned, and the subnets containing them are never banned either.
nets = [
  "127.0.0.0/8",
  "::1",
  "11.38.48.86",     # VPN
  "11.48.43.31",
  "11.51.237.68",    # eu.prod.push.monal-im.org
  "11.30.32.162",
]
# An address that logs in successfully (XMPP or SSH) gets a "protected" alert instead of a ban
# for that service's noise and typos, for trust_ttl after its last login, and blocked packets
# (tripwire ports too: their source is easily forged) don't count against it. It is still banned
# for canary names, other services and peers' reports; trust is not shared.
# Host names whose addresses are allowlisted too (a home connection with a dynamic DNS name),
# resolved every 10 minutes. Whoever controls the name's DNS controls this entry.
hosts = []
trust_authenticated = true
trust_ttl = "24h"

[xmpp]
c2s_ports = [5222, 5223]
noauth_grace = "90s"

[scoring]
# Burst detection: e.g. 3 TLS handshake failures within a few minutes.
fast_half_life = "10m"
fast_threshold = 100
# Low-and-slow detection: e.g. ~6 TLS failures spread over 4 hours.
slow_half_life = "12h"
slow_threshold = 200
port_spread_ports = 3     # distinct XMPP ports touched within spread_window
port_spread_bonus = 60
spread_window = "10m"
fw_scan_ports = 8         # distinct closed ports hit (UFW BLOCK) within spread_window
fw_scan_bonus = 60
compromise_score = 40     # login right after this much suspicious activity => critical alert

[scoring.weights]         # points per event; unlisted signals keep their defaults
xmpp_tls_fail = 40      # 3 strikes within ~5 min (34 would need them within ~25 s)
xmpp_auth_fail = 25     # 5 strikes within ~5 min
xmpp_no_auth = 10
xmpp_conn = 2
xmpp_s2s_bad = 25
xmpp_http_miss = 4
xmpp_token_fail = 5       # expired FAST token: nearly always a legitimate client
xmpp_register = 15        # in-band account registration (mass sign-ups from one address)
ssh_auth_fail = 25
ssh_invalid_user = 40
ssh_preauth = 8
ssh_penalty = 25
ssh_canary = 100          # login attempt on a [canary] name
xmpp_canary = 100
nc_canary = 100
fw_block = 1
fw_limit = 20
fw_tripwire = 100         # one hit on a [ports] tripwire port = ban (with honeypots: remove, for 50)
tripwire_connect = 100    # a completed handshake with a [ports] honeypot port
web_probe = 40            # Nextcloud: request for .env/config/../ refused (3 strikes)
nc_auth_fail = 25         # Nextcloud: failed login

[accounts]
half_life = "1h"
alert_failures = 20       # distributed guessing against one account
min_ips = 3
under_attack_multiplier = 2.0
new_network_alerts = true
learning_period = "7d"
# These accounts log in through rotating VPN exits, so "new network" alerts are just noise for them.
new_network_ignore = ["admin@example.org", "user5@example.org", "0123456789abcdef0123456789abcdef"]
new_key_alerts = true     # an SSH login with a key the account never used (after learning_period)

[subnets]
enabled = true
evaluate_every = "60s"
suspect_score = 50
v4_prefix = 24
v6_prefix = 64
min_bad_ips = 3           # /24 with 3+ individually bad addresses
min_contributors = 5      # ...or 5+ addresses whose combined score reaches the sum below
score_sum_threshold = 100
wide_enabled = true       # a banned /24 grows to the narrowest network that also holds the
v4_wide_prefix = 16       # next ban nearby (/23, /22, ...), up to this wide,
wide_max_step = 2         # and at most this many bits at a time (/24 -> /22 -> /20 ...)
v6_wide_prefix = 48       # IPv6: a banned /64 grows the same way up to a /48 ("64" = never),
wide_max_step_v6 = 4      # 4 bits at a time (providers hand out /64, /60, /56, /48)

[bans]
ladder = ["1h", "6h", "1d", "7d", "30d"]
forgive_after = "30d"

[enforce]
# auto: nftables, falling back to firewalld (if it runs), ufw (if installed), then iptables.
# Or one of nft, firewalld, ufw, iptables, ipset (README, "Firewall backends").
# iptables: logguard's chains in the mangle table, next to your own (iptables-persistent) rules;
# no rate limits or blocklist feeds. ipset: the same chains matching ipset sets (bans expire in
# the kernel, feeds work). firewalld: ipsets and a drop zone of logguard's; no rate limits or feeds.
backend = "auto"
nft = "/usr/sbin/nft"
nft_table = "logguard"
ufw = "/usr/sbin/ufw"
iptables = "/usr/sbin/iptables"
ip6tables = "/usr/sbin/ip6tables"
iptables_chain = "logguard"

[notify]
# XMPP warnings via `ejabberdctl send_message`. Users get messages only in enforce mode
# (unless users_in_shadow = true); admins always. Test with: logguard -c ... notify-test you@example.org
enabled = true
ejabberdctl = "/usr/sbin/ejabberdctl"
# Messages go through ejabberd's REST API on a loopback-only listener (README, "XMPP
# notifications"): the only way that is cheap and keeps line breaks, quotes and non-ASCII
# intact. ejabberdctl over CTL_OVER_HTTP loses multi-line messages and garbles non-ASCII.
api = "127.0.0.1:5285"
# Authenticate as a dedicated account, so ejabberd's api_permissions can allow send_message
# to it alone (README, "XMPP notifications"); without these, any local process can send as anyone.
#api_user = "logguard@example.org"
#api_password_file = "/etc/logguard/xmpp-api.password"   # root:root 0600
#ctl_socket = "/opt/ejabberd/database/ejabberd@localhost/ctl_over_http.sock"   # fallback without api: ASCII only
from = "example.org"          # the domain, not the bot: users get no notifications in the bot's chat
message_type = "chat"
admins = ["admin@example.org"]
user_topics = ["account_attack", "brute_force", "compromise"]   # + "new_network" if you want login-location notices
admin_topics = ["account_attack", "brute_force", "compromise", "registration", "false_positive", "protected", "system", "exposure", "integrity"]
users_in_shadow = false
cooldown = "6h"                  # per recipient, topic and account
max_per_hour = 30               # to users in total; admins get the same again per topic
# Language of the messages users receive: en (English), fr (French), de (German), pl (Polish), ru (Russian) or uk (Ukrainian).
# Admin messages are always English.
language = "en"
# Messages to the admins go through the XMPP admin bot (logguard-xmpp-bot), which sends them OMEMO-
# encrypted: logguard puts each in the bot's outbox. One the bot hasn't taken within
# bot_grace (bot down, no trusted admin device) goes out the usual way above, unencrypted,
# with a line saying why. Users' warnings always go the usual way. Test: notify-test --bot <admin>
bot_outbox = "/opt/logguard-xmpp-bot/outbox"
bot_user = "ejabberd"             # the bot's user: it gets the files (the outbox is sticky)
bot_grace = "2m"
bot_stuck_after = "1h"            # warn when the weekly abuse report waits longer than this
# Optional: a copy of every message to the first admin for the Telegram bot (logguard-tg-bot), which
# sends it to the admin's Telegram chat with XMPP account names replaced by pseudonyms
# (logguard-tg-bot's README). Unset: nothing goes to Telegram. With admins = [] (and no bot_outbox),
# admin messages go to Telegram only; users are still warned over XMPP. The weekly abuse
# report goes to both bots' outboxes set here. Test: notify-test --telegram
#tg_outbox = "/opt/logguard-tg-bot/outbox"
#tg_user = "logguard-tg-bot"
# Optional, the same for the mail bot (logguard-mail-bot): a copy of every message to the first admin,
# mailed OpenPGP-encrypted (subject too) through the local Postfix or any SMTP server
# (logguard-mail-bot's README). Next to tg_outbox or instead of it. Test: notify-test --mail
#mail_outbox = "/opt/logguard-mail-bot/outbox"
#mail_user = "logguard-mail-bot"
# Optional Signal and Matrix bots, like tg_outbox: a copy of the first admin's messages, sent
# end-to-end encrypted to the admin's Signal account (through signal-cli) or Matrix devices, and as
# OpenPGP files while that can't reach the admin's verified identity (logguard-signal-bot's and
# logguard-matrix-bot's READMEs). Test: notify-test --signal, notify-test --matrix
#signal_outbox = "/opt/logguard-signal-bot/outbox"
#signal_user = "logguard-signal-bot"
#matrix_outbox = "/opt/logguard-matrix-bot/outbox"
#matrix_user = "logguard-matrix-bot"
# (xmpp_outbox, logguard-xmpp-bot in client mode, is for hosts without ejabberd: the relay node's
# and the desktop's templates. Here logguard-xmpp-bot is the admin bot, bot_outbox above.)

[notify.languages]
# Per-account language, by user name or full JID; accounts not listed get `language` above.
# alice = "uk"
# "bob@example.org" = "ru"

[cluster]
# Share bans, suspicion reports and trusted addresses with other logguard nodes over an
# encrypted, authenticated TCP link (no VPN needed). All nodes use the same key; deploy.sh
# generates deploy/cluster.key once and installs it as /etc/logguard/cluster.key.
enabled = true
node_id = "xmpp"
listen = "0.0.0.0:7946"            # install.sh opens it in ufw for the peers below only
peers = ["11.38.48.86:7946"]           # vpn; peers are never banned here
key_file = "/etc/logguard/cluster.key"
rotate_after = "180d"             # then a weekly reminder to run deploy/rotate-cluster-key.sh
sync_interval = "10s"
full_sync_every = "10m"
share = ["bans", "unbans", "reports", "trust", "notices"]
accept = ["bans", "unbans", "reports", "trust", "notices"]
# Optional: a Telegram relay node (deploy/logguard-tg.toml, running logguard-tg-bot), so admin messages
# reach Telegram without this server talking to Telegram. Add it to `peers` above, let it hand
# over only notices and the abuse report's input (never bans or trust: the limit goes by its
# address), and relay this node's own admin messages to it. 203.0.113.10 = its address.
#peers = ["11.38.48.86:7946", "203.0.113.10:7946"]   # vpn, tg
#peer_accept = { "203.0.113.10:7946" = ["notices", "files"] }
#relay_notices = true
# Optional: node identities. Each node signs what it shares with a key of its own, so a node
# broken into (or a stolen cluster key) can speak only for itself, and deleting a node's line
# in `nodes` drops it without a new cluster key. `logguard cluster-identity --out
# /etc/logguard/node.key` on each node prints its line for `nodes`. Same `nodes` on every node;
# require_signatures once every node signs (README, "Node identities").
#identity_file = "/etc/logguard/node.key"
#nodes = { xmpp = "<public key>", vpn = "<public key>" }
#require_signatures = true
# Bans learned from peers last at most this long here. The built-in default (1d) limits what a
# compromised or mistaken node can do to the others; both nodes here are equally trusted, so
# mirror the origin's full ban ladder (a peer's 7d ban is 7d here too).
max_remote_ban = "30d"
report_factor = 0.5                # peer-reported points count half
min_report_points = 10
max_hops = 3
max_clock_skew = "5m"              # nodes need roughly correct clocks (systemd-timesyncd)
# Files peers send once (`logguard cluster-send-report`: the weekly abuse report the XMPP
# server merges and the bot delivers). "" refuses them.
inbox = "/var/lib/logguard/inbox"

[exposure]
enabled = true
interval = "60s"
ufw = "/usr/sbin/ufw"
ignore = []
startup_grace = "15m"     # weekly reboot: containers start after logguard, don't report them as gone/new
new_after_scans = 2
gone_after_scans = 5

[feeds]
# Public blocklists in their own nftables sets (feed4/feed6), refreshed daily.
# `logguard feeds clear` empties them in one step; enabled = false removes them on restart.
enabled = true
urls = [
  "https://www.spamhaus.org/drop/drop.txt",                 # Spamhaus DROP (includes former EDROP)
  "https://www.spamhaus.org/drop/dropv6.txt",
  "https://iplists.firehol.org/files/firehol_level1.netset",  # FireHOL level1 (private ranges are filtered out)
]
refresh = "24h"
cache_dir = "/var/lib/logguard/feeds"
fetch = ["curl", "-fsSL", "--proto-redir", "=https", "--max-time", "60", "--retry", "2", "--max-filesize", "50000000"]   # falls back to wget
max_entries = 100000
min_prefix_v4 = 12        # one bad entry must not drop a whole /8
min_prefix_v6 = 24
max_growth = 2.0          # refuse a refresh covering >2x the last accepted list (keeps that one)
# Networks (ASNs) to block wholesale, their address blocks taken from the [geo] network
# database (needs [geo] with asn_url): Spamhaus ASN-DROP lists hijacked and criminal networks.
asn_urls = ["https://www.spamhaus.org/drop/asndrop.json"]

[waf]
# Addresses a WAF or another security app blocks, enforced here for every port (and, as bans,
# on every cluster node): CrowdSec (its AppSec WAF and scenarios), or any app that gives out
# a list, in a format below. Read every `refresh`; a source that can't be read keeps what it
# had. `logguard waf` shows each source; `logguard waf clear` empties the list sets.
# CrowdSec: `cscli bouncers add logguard` prints the key; put it in api_key_file (chmod 600).
enabled = false
refresh = "1m"
cache_dir = "/var/lib/logguard/waf"
max_ban = "7d"            # longest ban a decision becomes
default_ban = "4h"        # for decisions without a duration (plain lists): renewed while listed
max_entries = 100000      # action = "list": all such sources together
min_prefix_v4 = 12
min_prefix_v6 = 24

[[waf.sources]]
# CrowdSec's own detections and `cscli decisions add`: one logguard ban each, for as long as
# the decision lasts, lifted when CrowdSec drops it. Never an allowlisted, peer or own
# address, nor one a user logged in from lately.
name = "crowdsec"
format = "crowdsec"
url = "http://127.0.0.1:8080/v1/decisions?type=ban&origins=crowdsec,cscli"
api_key_file = "/etc/logguard/crowdsec-bouncer.key"
action = "ban"
types = ["ban"]           # captcha and throttle are for an HTTP-layer bouncer
share = true              # with the cluster, like `logguard ban`

[[waf.sources]]
# CrowdSec's community blocklist (tens of thousands of addresses): into the sets waf4/waf6,
# like the feeds (nftables and ipset only), not as bans.
name = "crowdsec-capi"
format = "crowdsec"
url = "http://127.0.0.1:8080/v1/decisions?type=ban&origins=CAPI,lists"
api_key_file = "/etc/logguard/crowdsec-bouncer.key"
action = "list"

# Other apps: format = "plain" (one address per line), "json" (items = "result",
# ip_field = "ip", reason_field = "comment", duration_field / until_field / type_field /
# origin_field), "csv" (fields by header name or column number), or "regex" (pattern with
# groups ip, duration, until, type, origin, reason); from url, file or command, e.g.
# [[waf.sources]]
# name = "fail2ban"
# format = "regex"
# command = ["fail2ban-client", "banned"]      # [{'sshd': ['192.0.2.1', ...]}, ...]
# pattern = "'(?P<ip>[0-9a-fA-F.:]+)'"

[console]
# The read-only socket for logguard-web, the web console (logguard-web/README.md): its group
# reads this node's snapshot, digest preview and abuse reports there, never bans or unbans.
# Empty: off.
socket = ""                # "/run/logguard-console/console.sock" with logguard-web installed
group = "logguard-web"

[digest]
# One summary message per day at `at` (UTC): bans by cause, top offenders, alerts,
# exposure, cluster, feeds and certificate expiry.
enabled = true
at = "07:00"
certs = ["example.org:5223", "example.org:5222/xmpp", "nextcloud.example.org:443"]   # host:port, or host:port/xmpp for STARTTLS
# Certificates on disk: warns when a newer one exists than the one actually served
# (renewed, but certfiles not updated / ejabberd not reloaded).
cert_files = ["/opt/ejabberd/database/ejabberd@localhost/acme/live/*"]
cert_warn_days = 21
check_certs_every = "6h"
openssl = "/usr/bin/openssl"

[geo]
# Readable places ("Germany / Hetzner Online GmbH (AS24940)") in new-login alerts, bans, the TUI,
# `status` and the digest. Lookups happen in memory; only the databases are downloaded (weekly,
# ~12 MB, no account): DB-IP's free lite databases, CC BY 4.0 - credit "IP locations: DB-IP.com".
# A new /16 of a provider the account already used is no longer a "new network".
enabled = true
country_url = "https://download.db-ip.com/free/dbip-country-lite-{month}.csv.gz"
asn_url = "https://download.db-ip.com/free/dbip-asn-lite-{month}.csv.gz"
# Public-domain alternative for the network half (registry handles instead of company names):
# asn_url = "https://iptoasn.com/data/ip2asn-combined.tsv.gz"
dir = "/var/lib/logguard/geo"
refresh = "7d"
# Networks the lite database places in the wrong country, pinned to the right one (an ISO
# code or a name). Labels, accounts' countries and counters use it; [geoblock] doesn't.
#places = { "198.51.100.0/24" = "GE" }


[geoblock]
# Drop whole countries or networks (ASNs), by the [geo] databases above: no other database and
# no download, only the firewall's sets. DB-IP's lite data misplaces some addresses: coarse.
# Never dropped: the allowlist, this host, the cluster peers. Backends nft, ipset, firewalld.
enabled = false
countries = []            # e.g. ["CN", "Russia"]: ISO codes or names
only_countries = []       # e.g. ["UA", "DE"]: every other country dropped (federation, CDNs, ...)
asns = []                 # e.g. [64500]
[cron]
# New or changed scheduled tasks are a classic sign of a break-in. Watched: /etc/crontab,
# /etc/cron.d/*, every user's crontab (what `crontab -l` shows), /etc/cron.{hourly,daily,
# weekly,monthly,yearly}, enabled systemd timers, and the scripts crontab lines run
# (e.g. /usr/local/bin/*.sh). Everything present during `learn` is accepted; after that
# each change is reported once ("integrity" admin topic) and becomes the new normal.
# Files installed by a package and unmodified (digest recorded by rpm) are reported as warnings,
# anything else as high. See what is watched:  logguard -c ... integrity
enabled = true
interval = "1m"
learn = "1d"
# crontabs = ["/etc/crontab", "/etc/anacrontab", "/etc/cron.d/*", "/var/spool/cron/crontabs/*", "/var/spool/cron/*"]
# dirs = ["/etc/cron.hourly", "/etc/cron.daily", "/etc/cron.weekly", "/etc/cron.monthly", "/etc/cron.yearly", "/etc/systemd/system/timers.target.wants"]
scripts = true
# Other files whose changes are reported (`*` within one path component, in any component):
# SSH keys, sudoers, users, sshd settings, PAM, apt and dnf hooks, programs installed by hand,
# systemd units, preloaded libraries. Files of a pattern added later are learned
# silently; files of a removed pattern are forgotten.
# files = ["/etc/passwd", "/etc/shadow", "/etc/group", "/etc/sudoers", "/etc/sudoers.d/*",
#          "/etc/ssh/sshd_config", "/etc/ssh/sshd_config.d/*", "/root/.ssh/authorized_keys",
#          "/root/.ssh/authorized_keys2", "/home/*/.ssh/authorized_keys", "/home/*/.ssh/authorized_keys2",
#          "/etc/ssh/authorized_keys/*", "/etc/ld.so.preload", "/etc/ld.so.conf.d/*", "/etc/rc.local",
#          "/etc/profile.d/*", "/etc/environment", "/etc/bash.bashrc", "/root/.bashrc", "/root/.profile",
#          "/etc/pam.d/*", "/etc/apt/apt.conf.d/*", "/etc/dnf/plugins/post-transaction-actions.d/*",
#          "/etc/dnf/libdnf5-plugins/actions.d/*", "/etc/update-motd.d/*", "/etc/modules-load.d/*",
#          "/etc/modprobe.d/*", "/etc/udev/rules.d/*", "/etc/init.d/*", "/usr/local/bin/*", "/usr/local/sbin/*",
#          "/etc/systemd/system/*", "/etc/systemd/system/*.wants/*", "/etc/systemd/system/*.d/*.conf"]
rpm = "/usr/bin/rpm"            # asked which package owns a changed file (rpm -qf)

[antivirus]
# Reports infected files found by scheduled ClamAV scans (critical), scans that did not
# finish (killed for memory, typically) and scans that stopped happening (stale_after).
# install.sh enables logguard-avscan.timer (daily 02:30, scan paths in
# /etc/default/logguard-avscan), which writes this log. Plain `clamscan --stdout` output
# appended to a file works too, e.g. log = "/var/log/av_scan_result.log".
enabled = true
log = "/var/log/logguard/avscan.log"
stale_after = "36h"
# Scans of the files the integrity watches report new or changed (cron jobs and their
# scripts, watched files, changed package files, set-uid programs, programs running from
# /tmp or deleted): "none", "clamav", "yara" or "both". Infected files are high alerts.
# clamscan and yara run outside logguard's memory limit (systemd-run, scan_memory).
scan_changed = "none"
# yara_rules = ["/etc/logguard/yara"]      # .yar/.yara files, directories of them, or one .yarc
# clamd_socket = "/run/clamav/clamd.ctl"   # while it exists, files go to clamd (Fedora: /run/clamd.scan/clamd.sock)
# scan_memory = "2G"
# scan_timeout = "30m"
# scan_max_mb = 100

[journal]
journalctl = "/usr/bin/journalctl"
# matches = [...]          # default: derived from [sources]
initial_lookback = "1h"
# journalctl --verify every so often ("0s" = never): damaged journal files, or with the
# verification key of Forward Secure Sealing (journalctl --setup-keys) entries changed after
# they were sealed. Separately, a high alert says when journald no longer has the position
# logguard read up to (journal files vacuumed or deleted while lines were unread).
verify_every = "0s"
# The verification key can seal entries too (every sealing key derives from it): on this
# server it only catches an intruder who doesn't look for it, and journalctl shows it to
# local users (ps) during each check unless /proc is mounted with hidepid=invisible.
# verify_key_file = "/etc/logguard/journal-verify.key"   # root only, 0600

[resources]
# Low disk space (warning below 10% free, high below 5%) and memory that stays short
# (under 10% available for 15 min, or tasks stalled on memory 10% of the time), checked
# every minute; each alert at most every 6 hours. /tmp is a tmpfs in RAM on this host.
enabled = true
interval = "60s"
disks = ["/", "/tmp"]
disk_warn_percent = 10
disk_high_percent = 5
mem_warn_percent = 10
mem_sustain = "15m"
psi_full_percent = 10

[patches]
# In the daily digest and the dashboard: pending security updates (dnf --cacheonly check-update,
# run in a transient unit of its own with systemd-run, outside logguard's memory limit), a newer
# kernel than the running one, /run/reboot-required, programs still running replaced libraries.
enabled = true
interval = "6h"
apt = true                 # here: dnf (package_manager)

[verify]
# Weekly: package programs and libraries hashed against rpm's digests (like rpm -Va; a
# replaced binary is how a rootkit hides), and the set-uid/set-gid programs, learned on the
# first pass. Reads at most max_rate_mb MB a second.
enabled = true
interval = "7d"
dirs = ["/usr/bin", "/usr/sbin", "/usr/lib", "/usr/libexec"]
exclude = ["/usr/lib/firmware"]
max_rate_mb = 20

[procwatch]
# Every minute from /proc: new outbound connections by program and remote port (learned for
# `learn`, then each new pair is reported once; shells and network tools talking out, and the
# ports miners and reverse shells use, are always high), and programs running from /tmp,
# /dev/shm, memory only, or a deleted file outside the package directories.
enabled = true
interval = "60s"
learn = "3d"
ignore_processes = []
ignore_ports = []

[ssh_audit]
# Hourly: sshd's effective settings (sshd -T, with -C for root and the gateway users, so Match
# blocks count) checked against good practice and this host's layout: a plain VPS, a hosting
# panel (cPanel/WHM, Plesk, ...), or a gateway like harden-vps.sh's (one key-only user forced
# into the su/sftp wrapper, su limited by pam_wheel, root-owned key files, no root login).
# New problems and changed settings are alerts; `logguard ssh-audit` shows all, with fixes.
enabled = true
interval = "1h"
profile = "auto"             # auto | standard | gateway
gateway_users = []           # empty: AllowUsers' users with a ForceCommand
su_group = "gw-su"
ignore = []                  # problem ids, e.g. ["x11-forwarding", "gateway-port"]
remind = "7d"                # high problems still open, again

# Log lines of your own (a service logguard has no parser for): a regex with the client
# address in group `ip` (and the account in `user`), over a systemd unit's journal lines or a
# log file. Try one with:  logguard -c ... test-pattern --pattern NAME FILE
# [[patterns]]
# name = "postfix_sasl"
# unit = "postfix@-.service"        # journal lines of this unit (or: identifier + uid; or: file)
# regex = 'warning: [^\[]*\[(?P<ip>[0-9A-Fa-f.:]+)\]: SASL \S+ authentication failed(: [^,]*, sasl_username=(?P<user>\S+))?'
# kind = "failure"                  # failure (per account), probe, or success (a login)
# weight = 25
# port = 587
